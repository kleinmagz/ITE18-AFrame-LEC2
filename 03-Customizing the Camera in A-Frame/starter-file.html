<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <title>Customizing the Camera in A-Frame</title>
</head>
<body>
    <a-scene>
        <!-- Asset Management System -->
    <a-assets>
        <img id="floor" src="assets/floor-1024.jpg">
        <img id="average-height" src="assets/average-height.png">
    </a-assets>

    <!-- Ground -->
     <a-plane src="#floor" shader="flat" rotation="-90 0 0" scale="5 5 1"></a-plane>
    </a-scene>
</body>
</html>
