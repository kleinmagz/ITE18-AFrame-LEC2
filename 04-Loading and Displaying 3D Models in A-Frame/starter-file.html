<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <title>Loading and Displaying 3D Models in A-Frame</title>

</head>
<body>
    <a-scene>
        <!-- Asset Management System -->
        <a-assets>
            <a-asset-item id="castle-scene" src="assets/scene.gltf"></a-asset-item>
            <a-asset-item id="catapult-obj" src="assets/Catapult.obj"></a-asset-item>
            <a-asset-item id="catapult-mtl" src="assets/Catapult.mtl"></a-asset-item>
            <img id="sky" src="assets/clear-sunny-sky.jpg">
        </a-assets>
        
        <!-- Sky -->
         <a-sky src="#sky"></a-sky>

        <!-- CAMERA -->
         <a-entity
            position="0 5 0"
         >
            <a-camera></a-camera>
        </a-entity>
        <!-- <a-entity
            id="player"
            camera
            look-controls
            wasd-controls="acceleration: 150"
            position="0 5 10"
            log-position
        ></a-entity> -->

        <!-- CASTLE SCENE-->
        <a-entity
            gltf-model="#castle-scene"
            position="0 0 0"
            scale="500 500 500"
        ></a-entity>

        <!-- CATAPULT -->
         <a-entity
            obj-model="
                obj: #catapult-obj;
                mtl: #catapult-mtl;
            "
            position="-53.64 0 294.73"
            rotation="0 200 0"
            scale="1 1 1"
         ></a-entity>
    </a-scene>
</body>
</html>
